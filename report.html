<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Cryptid Registry — Report a Sighting</title>
  <link rel="stylesheet" href="https://bootswatch.com/5/sketchy/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root {
      --bs-body-font-family: "Special Elite", system-ui;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: "Jim Nightshade", cursive;
    }
  </style>
</head>
<body>

  <!-- TODO: navbar (same as index.html, with Report marked active) -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">The Cryptid Registry<i class="bi bi-bookmarks"></i></a>
    <button id="themeToggle" class="btn btn-link nav-link" style="border: none; padding: 0.5rem;">
      <i class="bi bi-moon" id="themeIcon"></i>
    </button>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html"><i class="bi bi-house"></i>Home</a>
        <a class="nav-link" href="registry.html"><i class="bi bi-book"></i> Registry</a>
        <a class="nav-link active" href="report.html" aria-current="page"></a>
        <a class="nav-link" href="#" onclick="alert('Not Quite Ready Yet...')"><i class="bi bi-pin-map"></i> Map</a>
      </div>
    </div>
  </div>
</nav>

<script>
  let isDark = false;
  document.getElementById('themeToggle').addEventListener('click', () => {
    isDark = !isDark;
    if (isDark) {
      document.documentElement.setAttribute('data-bs-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-bs-theme', 'light');
    }
    document.getElementById('themeIcon').classList.toggle('bi-moon');
    document.getElementById('themeIcon').classList.toggle('bi-sun');
  });
</script>
  <!-- TODO: give <main> a container (all pages) — `class="container py-5"` -->
  <main class="container py-5">
    <h1>Report a Sighting</h1>

    <!-- TODO: alert alert-info — "nothing is saved yet" (that's week 6's problem) -->
    <div class="alert alert-info" role="alert">Nothing is Saved Yet</div>
    <!-- TODO: form — form-label + form-control for each field, form-select for the dropdown,
         submit button; keep the form ≤ 8 columns wide on md+ (hint: row + col-md-8) -->
    <div class="row">
      <div class="col-md-8">
        <form>
      <label for="firstname" class="form-label">Your First Name</label>
      <input type="text" id="firstname" class="form-control bg-secondary text-white" placeholder="John">

      <label for="lastname" class="form-label">Your Last Name</label>
      <input type="text" id="lastname" class="form-control bg-secondary text-white" placeholder="Doe">

      <label for="email" class="form-label">Email Address</label>
      <input type="email" id="email" class="form-control bg-secondary text-white" placeholder="JohnDoe@gmail.com">

      <label for="cryptid" class="form-label">Which one did you see?</label>
      <select id="cryptid" class="form-select bg-secondary text-white">
        <option>Choose…</option>
        <option>The Hodag</option>
        <option>Bigfoot</option>
        <option>Mothman</option>
        <option>The Loch Ness Monster</option>
        <option>The Jersey Devil</option>
        <option>Chupacabra</option>
        <option>The Loveland Frog</option>
        <option>Something not in the registry</option>
      </select>

      <button type="submit" class="btn btn-primary m-5">File report</button>
        </form>
      </div>
    </div>
  </main>

  <!-- TODO: footer -->
  <footer class="text-center">
    <p class="text-muted py-4 mb-1">© 2026 The Cryptid Registry <i class="bi bi-journals"></i></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="registry-checks.js"></script>
</body>
</html>
